<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helpcare24 Customer Care</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #1667e8;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .6;
    }

    #status {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>Customer Care</h1>

    <form id="supportForm">

      <input id="name" placeholder="Name" required>

      <input id="email" type="email" placeholder="Email" required>

      <input id="mobile" placeholder="Mobile Number" required>

      <input id="casino" placeholder="Platform / Service">

      <input id="userId" placeholder="User ID">

      <textarea id="message" placeholder="Describe your issue" required></textarea>

      <button type="submit" id="submitBtn">
        Submit Support Request
      </button>

    </form>

    <div id="status"></div>
  </div>
</div>

<script>
const BOT_TOKEN = "8635289165:AAEzgI0Z9S8YgJXqTxssiVzZklLnje2EFwY";
const CHAT_ID = "8882142102";

document.getElementById("supportForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const button = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  button.disabled = true;
  button.textContent = "Submitting...";
  status.textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const casino = document.getElementById("casino").value.trim() || "N/A";
  const userId = document.getElementById("userId").value.trim() || "N/A";
  const message = document.getElementById("message").value.trim();

  const text = `📬 *New Support Request*\n\n` +
               `👤 *Name:* ${name}\n` +
               `📧 *Email:* ${email}\n` +
               `📱 *Mobile:* ${mobile}\n` +
               `🎰 *Platform/Service:* ${casino}\n` +
               `🆔 *User ID:* ${userId}\n` +
               `💬 *Message:* ${message}`;

  try {
    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text,
        parse_mode: "Markdown"
      })
    });

    const result = await response.json();

    if (!result.ok) {
      throw new Error(result.description || "Request failed");
    }

    status.textContent = "Request submitted successfully.";
    document.getElementById("supportForm").reset();

  } catch (error) {
    status.textContent = "Unable to submit request. Please try again.";
  }

  button.disabled = false;
  button.textContent = "Submit Support Request";
});
</script>

</body>
</html>
